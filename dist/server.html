<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="approval-path-api" content="/api/generate">
<title>Approval Path: OAuth app setup guides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0EE; --sheet:#F8FAF9; --ink:#17262B; --muted:#56676C; --rule:#C8D1CE;
  --work:#2448C9; --wait:#B7791F; --hard:#A8323A; --easy:#2E7D5B; --mid:#B7791F;
  --chip:#E1E7E4; --focus:#2448C9;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111B1E; --sheet:#172428; --ink:#E3EAE7; --muted:#9AABA8; --rule:#2F4044;
    --work:#86A0FF; --wait:#E2A84E; --hard:#EE848A; --easy:#6CC79C; --mid:#E2A84E;
    --chip:#22343A; --focus:#86A0FF; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111B1E; --sheet:#172428; --ink:#E3EAE7; --muted:#9AABA8; --rule:#2F4044;
  --work:#86A0FF; --wait:#E2A84E; --hard:#EE848A; --easy:#6CC79C; --mid:#E2A84E;
  --chip:#22343A; --focus:#86A0FF; color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:16px; line-height:1.55; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
a{ color:var(--work); text-underline-offset:2px; }
button,input{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:4px; }
.wrap{ max-width:1080px; margin:0 auto; padding:28px 20px 80px; }
.brand{ display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-bottom:40px; }
.brand b{ font-weight:700; letter-spacing:-.01em; }
.brand a{ font-size:14px; }
.muted{ color:var(--muted); }
h1,h2,h3{ line-height:1.15; letter-spacing:-.02em; margin:0; }

/* ---------- Home ---------- */
.ask h1{ font-size:clamp(30px,5vw,52px); font-weight:600; max-width:16ch; }
.ask p.lede{ max-width:60ch; margin:14px 0 24px; color:var(--muted); font-size:17px; }
.askform{ display:flex; gap:10px; flex-wrap:wrap; max-width:680px; }
.askform input{
  flex:1 1 280px; padding:14px 16px; border:1.5px solid var(--ink); border-radius:10px;
  background:var(--sheet); font-size:17px;
}
.btn{
  padding:13px 18px; border-radius:10px; border:1.5px solid var(--ink); background:var(--ink); color:var(--paper);
  font-weight:600; cursor:pointer;
}
.btn.ghost{ background:transparent; color:var(--ink); }
.btn.small{ padding:7px 12px; font-size:14px; border-radius:8px; }
.btn:disabled{ opacity:.5; cursor:default; }
.hint{ font-size:14px; color:var(--muted); margin-top:10px; }

.legend{ display:flex; gap:22px; flex-wrap:wrap; font-size:14px; color:var(--muted); margin:48px 0 10px; align-items:center; }
.sw{ display:inline-block; width:22px; height:10px; border-radius:3px; vertical-align:middle; margin-right:6px; }
.sw.work{ background:var(--work); }
.sw.wait{ background:repeating-linear-gradient(135deg,var(--wait) 0 3px,transparent 3px 6px); border:1px solid var(--wait); }

.libhead{ display:flex; justify-content:space-between; align-items:end; gap:16px; flex-wrap:wrap; margin-top:8px; }
.libhead h2{ font-size:24px; font-weight:600; }
.tabs{ display:flex; gap:4px; background:var(--chip); padding:4px; border-radius:10px; }
.tabs button{ border:0; background:transparent; padding:6px 12px; border-radius:7px; cursor:pointer; font-size:14px; }
.tabs button[aria-pressed="true"]{ background:var(--sheet); font-weight:600; }

.axis{ display:grid; grid-template-columns:minmax(150px,220px) 1fr; gap:16px; font-size:12px; color:var(--muted); margin-top:18px; padding:0 14px; }
.ticks{ position:relative; height:16px; }
.ticks span{ position:absolute; transform:translateX(-50%); white-space:nowrap; }
.ticks span:first-child{ transform:none; }
.ticks span:last-child{ transform:translateX(-100%); }

.lib{ list-style:none; margin:6px 0 0; padding:0; border-top:1px solid var(--rule); }
.lib li{ border-bottom:1px solid var(--rule); }
.row{
  display:grid; grid-template-columns:minmax(150px,220px) 1fr; gap:16px; align-items:center;
  padding:14px; width:100%; text-align:left; background:none; border:0; cursor:pointer; border-radius:0;
}
.row:hover{ background:var(--sheet); }
.row .nm{ font-weight:600; font-size:17px; }
.row .ct{ font-size:13px; color:var(--muted); }
.row .pending{ font-size:14px; color:var(--muted); }
.stack{ display:flex; flex-direction:column; gap:5px; }
.track{ position:relative; height:12px; }
.track::before{ content:""; position:absolute; left:0; right:0; top:50%; border-top:1px dashed var(--rule); }
.bar{ position:absolute; top:1px; height:10px; border-radius:3px; }
.bar.work{ background:var(--work); }
.bar.wait{ background:repeating-linear-gradient(135deg,var(--wait) 0 3px,transparent 3px 6px); border:1px solid var(--wait); }
.bar.unknown{ opacity:.55; }
.bar.zero{ width:3px !important; background:var(--work); }

/* ---------- Guide ---------- */
.back{ background:none; border:0; padding:0; color:var(--work); cursor:pointer; font-size:15px; text-decoration:underline; text-underline-offset:2px; }
.gtop{ margin:22px 0 8px; display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap; align-items:flex-start; }
.gtop h1{ font-size:clamp(32px,5vw,48px); font-weight:600; }
.gmeta{ font-size:14px; color:var(--muted); margin-top:6px; }
.actions{ display:flex; gap:8px; flex-wrap:wrap; }
.verdict{ font-size:clamp(19px,2.4vw,23px); line-height:1.4; max-width:62ch; margin:18px 0 28px; font-weight:500; }
.banner{ border:1.5px solid var(--wait); border-radius:10px; padding:12px 16px; margin:0 0 24px; max-width:78ch; font-size:15px; background:var(--sheet); }

.paths{ background:var(--sheet); border:1px solid var(--rule); border-radius:14px; padding:18px 18px 10px; margin-bottom:36px; }
.paths h2{ font-size:15px; font-weight:600; margin-bottom:4px; }
.paths .axis{ padding:0; margin-top:12px; }
.prow{ display:grid; grid-template-columns:minmax(150px,240px) 1fr; gap:16px; padding:12px 0; border-top:1px solid var(--rule); align-items:start; }
.prow:first-of-type{ border-top:0; }
.prow .pn{ font-weight:600; font-size:15px; }
.prow .pt{ font-size:13px; margin-top:2px; }
.prow .sum{ font-size:14px; margin-top:6px; color:var(--muted); }
.tier{ font-weight:600; }
.tier.easy{ color:var(--easy); } .tier.mid{ color:var(--mid); } .tier.hard{ color:var(--hard); }

.cols{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:44px; }
@media (max-width:880px){ .cols{ grid-template-columns:1fr; gap:28px; } }
section{ margin-bottom:38px; }
section > h2{ font-size:21px; font-weight:600; margin-bottom:14px; }
.items{ list-style:none; padding:0; margin:0; }
.items li{ padding:10px 0; border-top:1px solid var(--rule); }
.items li:first-child{ border-top:0; padding-top:0; }
ol.steps{ list-style:none; counter-reset:s; padding:0; margin:0; }
ol.steps li{ counter-increment:s; display:grid; grid-template-columns:34px 1fr; gap:10px; padding:14px 0; border-top:1px solid var(--rule); }
ol.steps li:first-child{ border-top:0; padding-top:0; }
ol.steps li::before{ content:counter(s); font-weight:700; font-size:20px; line-height:1.2; color:var(--work); }
.it{ font-weight:600; }
.id{ margin-top:3px; max-width:68ch; }
.tags{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; font-size:13px; color:var(--muted); align-items:center; }
.ev{ display:inline-flex; align-items:center; gap:5px; }
.ev::before{ content:""; width:8px; height:8px; border-radius:50%; background:currentColor; }
.ev.tested{ color:var(--easy); } .ev.docs{ color:var(--work); } .ev.report{ color:var(--wait); } .ev.model{ color:var(--hard); }
.who{ border:1px solid var(--rule); border-radius:999px; padding:0 8px; }
.src{ font-size:13px; }
.impact-high .it::after{ content:" High impact"; font-weight:500; font-size:12px; color:var(--hard); margin-left:6px; }
.ifthen dt{ font-weight:600; }
.ifthen dd{ margin:3px 0 14px; }
pre{ background:var(--chip); border-radius:10px; padding:14px; overflow-x:auto; font-family:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size:13px; line-height:1.5; }

aside .card{ border:1px solid var(--rule); border-radius:14px; padding:16px 18px; margin-bottom:18px; background:var(--sheet); }
aside h3{ font-size:16px; font-weight:600; margin-bottom:10px; }
aside ul{ margin:0; padding-left:18px; }
aside li{ margin:4px 0; font-size:15px; }
.split h4{ margin:12px 0 4px; font-size:14px; font-weight:600; }
.split h4:first-child{ margin-top:0; }
.evsum{ display:grid; grid-template-columns:auto 1fr; gap:4px 10px; font-size:14px; }
.evsum b{ text-align:right; }
.srclist{ list-style:none; padding:0 !important; }
.srclist li{ padding:6px 0; border-top:1px solid var(--rule); font-size:14px; }
.srclist li:first-child{ border-top:0; }
.kind{ font-size:12px; color:var(--muted); display:block; }

/* ---------- Generation ---------- */
.gen{ background:var(--sheet); border:1px solid var(--rule); border-radius:14px; padding:22px; max-width:720px; margin-top:24px; }
.gen h2{ font-size:22px; font-weight:600; }
.stages{ list-style:none; padding:0; margin:18px 0 0; }
.stages li{ display:grid; grid-template-columns:22px 1fr; gap:10px; padding:10px 0; border-top:1px solid var(--rule); }
.stages li:first-child{ border-top:0; }
.dot{ width:12px; height:12px; border-radius:50%; border:2px solid var(--rule); margin-top:6px; }
.dot.run{ border-color:var(--work); border-top-color:transparent; animation:spin .9s linear infinite; }
.dot.done{ background:var(--easy); border-color:var(--easy); }
.dot.fail{ background:var(--hard); border-color:var(--hard); }
@keyframes spin{ to{ transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce){ .dot.run{ animation:none; background:var(--work); } }
.stages .sn{ font-weight:600; }
.stages .sd{ font-size:14px; color:var(--muted); }
.err{ color:var(--hard); margin-top:12px; }
.toast{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:10px; font-size:14px; z-index:20; }
.foot{ margin-top:60px; font-size:14px; color:var(--muted); max-width:75ch; }
@media (max-width:620px){
  .row,.axis,.prow{ grid-template-columns:1fr; gap:6px; }
  .axis > div:first-child{ display:none; }
  .ticks span:nth-child(5){ display:none; }
}
</style>
</head>

tion","d":"Paste the client ID and secret into your auth config. Only new connections use your app; existing users keep refreshing through the previous credentials until they reconnect.","who":"you","ev":"docs","src":["composio-wl-2"]}],"nuances":[{"t":"Organizations must approve OAuth apps","d":"OAuth apps need organization approval by default and cannot be approved per repository. A user in a restricted org can sign in, but org data stays hidden until an owner approves. Tell customers how to request access in your onboarding.","impact":"high","ev":"docs","src":["gh-limit"]},{"t":"OAuth app or GitHub App","d":"GitHub Apps allow up to 10 callback URLs and finer-grained permissions. If your platform supports GitHub Apps, compare before committing; this guide covers the OAuth app most integration platforms ask for.","impact":"medium","ev":"docs","src":["gh-callback"]},{"t":"Scopes are coarse","d":"Classic OAuth scopes such as repo grant broad access to private repositories. Users and security reviewers may push back; request the narrowest scope that works.","impact":"medium","ev":"model","src":[]}],"blockers":[{"if":"A user connects but sees none of their organization's repositories","then":"The org has OAuth app access restrictions. The user requests access from the authorization screen and an org owner approves it in the org's settings."},{"if":"You need different callback URLs per environment","then":"Register one OAuth app per environment, or move to a GitHub App, which supports multiple callback URLs."}],"agent":{"can":["Draft the app name and description","Work out the callback URL from your integration platform","Open the exact registration page","Check the finished config against this guide"],"you":["Sign in to GitHub (agents cannot pass the login wall)","Click Register and generate the secret","Store the secret safely","Ask customer org owners to approve the app"]},"tested":[{"what":"Requested github.com/settings/applications/new and /settings/developers without an account","result":"Both return 302 to the GitHub sign-in page. The registration form cannot be reached unauthenticated, so field-level steps rely on GitHub's docs.","date":"2026-10-28"}],"uncertain":["How long customer org approval takes varies by customer; GitHub imposes no wait of its own.","Whether your integration platform supports GitHub Apps instead of OAuth apps."],"sources":[{"id":"gh-create","title":"GitHub Docs: Creating an OAuth app","url":"https://docs.github.com/en/enterprise-server@3.1/apps/building-oauth-apps/creating-an-oauth-app","kind":"official"},{"id":"gh-limit","title":"GitHub Docs: Limiting OAuth app and GitHub App access requests","url":"https://docs.github.com/en/organizations/managing-programmatic-access-to-your-organization/limiting-oauth-app-and-github-app-access-requests-and-installations","kind":"official"},{"id":"gh-callback","title":"GitHub Docs: About the user authorization callback URL","url":"https://docs.github.com/en/apps/creating-github-apps/registering-a-github-app/about-the-user-authorization-callback-url","kind":"official"},{"id":"weweb-gh","title":"WeWeb: GitHub provider setup (one callback URL per app)","url":"https://docs.weweb.io/database-and-apis/auth/providers/github.html","kind":"third-party"},{"id":"composio-wl","title":"Composio Docs: White-labeling authentication","url":"https://docs.composio.dev/docs/guides/white-labeling-authentication","kind":"official"},{"id":"composio-wl-2","title":"Composio Docs: Switching to your own OAuth app","url":"https://docs-2gqx4xowi.preview.composio.dev/docs/white-labeling-authentication","kind":"official"},{"id":"probe-gh","title":"Agent probe: unauthenticated request to the registration page","url":"https://github.com/settings/applications/new","kind":"probe"}]},{"id":"slack","name":"Slack","domain":"slack.com","category":"Communication","checked":"2026-10-28","mode":"verified","headline":"Creating the app takes under an hour. Selling it to other companies is the hard part: Slack's terms route commercial distribution through Marketplace review, and unlisted apps get a 1 request per minute limit on reading messages.","startUrl":"https://api.slack.com/apps","paths":[{"name":"Internal app for your own workspace","tier":"self-serve","hands":[20,60],"wait":[0,0],"note":"Internal customer-built apps keep standard rate limits."},{"name":"Unlisted app installed by customers","tier":"restricted","hands":[30,90],"wait":[0,0],"note":"Works immediately, but message-history reads are throttled and the terms point commercial apps to the Marketplace."},{"name":"Slack Marketplace listing","tier":"review-required","hands":[480,1440],"wait":[10080,60480],"waitUnknown":true,"note":"Needs 10 active workspace installs before you can submit. Slack publishes no review SLA."}],"prereqs":[{"t":"A Slack workspace where you can install apps, for testing.","ev":"model","src":[]},{"t":"An HTTPS redirect URL (your integration platform's callback).","ev":"model","src":[]},{"t":"For the Marketplace: at least 10 installations on active workspaces before you submit.","ev":"docs","src":["slack-changelog"]}],"steps":[{"t":"Create the app from a manifest","d":"At api.slack.com/apps choose Create New App, then From a manifest. Paste the manifest below, which sets the name, redirect URL and scopes in one go.","who":"both","ev":"model","src":[]},{"t":"Check OAuth and permissions","d":"Confirm the redirect URL and scopes under OAuth & Permissions. Ask only for scopes you use; reviewers check this.","who":"you","ev":"model","src":[]},{"t":"Install to your own workspace and test","d":"Install, complete a real OAuth connection through your integration, and call one API method.","who":"you","ev":"model","src":[]},{"t":"Activate public distribution","d":"Under Manage Distribution, work through Slack's checklist and activate public distribution so other workspaces can install the app.","who":"you","ev":"model","src":[]},{"t":"Decide on the Marketplace","d":"If you charge customers and read message history, plan the Marketplace submission early. You need 10 active installs first, so recruit design partners.","who":"you","ev":"docs","src":["slack-changelog","slack-rl-faq"]}],"snippet":{"label":"App manifest your agent can generate","lang":"yaml","code":"display_information:\n  name: Acme Agent\noauth_config:\n  redirect_urls:\n    - https://YOUR-CALLBACK-URL\n  scopes:\n    bot:\n      - channels:read\n      - chat:write\nsettings:\n  org_deploy_enabled: false\n  socket_mode_enabled: false"},"nuances":[{"t":"Reading history is throttled for unlisted apps","d":"For commercially distributed apps outside the Marketplace, conversations.history and conversations.replies are limited to 1 request per minute, with the page size cut to 15 objects. This hit new apps from May 29, 2025 and existing installs from March 3, 2026. An agent that summarizes channels will feel this immediately.","impact":"high","ev":"docs","src":["slack-rl-changelog","slack-rl-ja","slack-changelog"]},{"t":"The terms point commercial apps to the Marketplace","d":"Slack's updated API terms say the Marketplace is the only appropriate channel for commercially distributing apps, including unlisted ones.","impact":"high","ev":"docs","src":["slack-changelog"]},{"t":"Internal apps are unaffected","d":"Apps a customer builds for their own workspace keep their existing rate limits.","impact":"low","ev":"docs","src":["slack-changelog"]},{"t":"Classic apps are being retired","d":"If you are reusing an old classic app, Slack's deprecation date is November 16, 2026. Create a new app instead.","impact":"medium","ev":"docs","src":["slack-changelog"]}],"blockers":[{"if":"Your agent returns only 15 messages and hits 429 errors","then":"You are on the non-Marketplace limit. Cache aggressively, backfill slowly using the Retry-After header, and start the Marketplace path."},{"if":"You cannot reach 10 active installs for the Marketplace","then":"Ship as unlisted to design partners first, within the rate com","category":"Email","checked":"2026-10-28","mode":"verified","headline":"The OAuth client takes 20 minutes. Reading email is the longest path in this library: Google verification plus an annual third-party security assessment, usually weeks and not free.","startUrl":"https://console.cloud.google.com/apis/credentials","paths":[{"name":"Testing mode (up to 100 test users)","tier":"self-serve","hands":[20,45],"wait":[0,0],"note":"Refresh tokens expire after 7 days. Fine for demos, breaks production sync."},{"name":"Send only (gmail.send, a sensitive scope)","tier":"review-required","hands":[180,480],"wait":[4320,20160],"waitUnknown":true,"note":"Verification and a demo video, but no security assessment."},{"name":"Read or modify mail (restricted scopes)","tier":"gated","hands":[960,2880],"wait":[14400,86400],"note":"Verification plus a CASA security assessment, renewed every year."}],"prereqs":[{"t":"A Google Cloud project with the Gmail API enabled.","ev":"report","src":["unified-gmail"]},{"t":"A public homepage and privacy policy on a domain you own.","ev":"model","src":[]},{"t":"A demo video showing how you use each sensitive or restricted scope.","ev":"report","src":["nylas"]},{"t":"For restricted scopes: your product must fit one of Google's permitted Gmail application types.","ev":"report","src":["unified-gmail"]},{"t":"For restricted scopes: budget for a CASA assessment from a Google-approved lab.","ev":"report","src":["nango"]}],"steps":[{"t":"Choose your scopes first","d":"This decides the whole timeline. Every Gmail read scope, including gmail.readonly, is restricted. gmail.send is only sensitive. If your agent only sends mail, stop at gmail.send.","who":"agent","ev":"report","src":["unified-gmail"]},{"t":"Create the project and enable the Gmail API","d":"In Google Cloud console, create a project for production (separate from dev) and enable the Gmail API.","who":"you","ev":"report","src":["unified-gmail"]},{"t":"Configure branding and audience","d":"Set const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s).toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\.(com|io|so|app|dev|co|net|org|ai)(\/.*)?$/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60) || 'app';
const MAX = 129600; // 90 days in minutes
const pos = m => m <= 1 ? 0 : Math.min(100, Math.log(m)/Math.log(MAX)*100);
const TICKS = [[1,'1 min'],[60,'1 hr'],[1440,'1 day'],[10080,'1 wk'],[43200,'1 mo'],[129600,'3 mo']];
const UNITS = [[43200,'mo'],[20160,'wk'],[1440,'days'],[60,'hr'],[1,'min']]; // weeks from 2 wk, so 10 days reads as days
function unitFor(m){ for (const [u,l] of UNITS) if (m >= u) return [u,l]; return [1,'min']; }
function fmt(m){ if (!m) return '0 min'; const [u,l]=unitFor(m); const v=m/u; return `${v<10&&v%1? v.toFixed(1).replace(/\.0$/,''):Math.round(v)} ${l==='days'&&Math.round(v)===1?'day':l}`; }
function fmtRange(a,b){
  if (!b) return 'none';
  const [ua,la]=unitFor(a||1),[ub,lb]=unitFor(b);
  if (la===lb){ const r=v=>{const x=v/ub; return x<10&&x%1? x.toFixed(1).replace(/\.0$/,''):Math.round(x);}; return `${r(a)}–${r(b)} ${lb}`; }
  return `${a?fmt(a):'0'}–${fmt(b)}`;
}
const TIER = {
  "self-serve":["Self-serve","easy"], "customer-approval":["Each customer approves","mid"], "restricted":["Works, with limits","mid"],
  "paid":["Paid access","mid"], "review-required":["Review required","hard"], "gated":["Heavy review","hard"], "no-oauth":["No OAuth","mid"], "unknown":["Unclear","mid"]

/* ---------- time ruler ---------- */
function axisHTML(labelCol=true){
  return `<div class="axis" aria-hidden="true">${labelCol?'<div></div>':''}<div class="ticks">${TICKS.map(([m,l])=>`<span style="left:${pos(m)}%">${l}</span>`).join('')}</div></div>`;
}
function trackHTML(p){
  const h0=p.hands[0], h1=p.hands[1], w0=(p.wait||[0,0])[0], w1=(p.wait||[0,0])[1];
  let s = `<div class="track" role="img" aria-label="${esc(`${fmtRange(h0,h1)} of work, wait ${fmtRange(w0,w1)}`)}">`;
  s += `<div class="bar work" style="left:${pos(h0)}%;width:${Math.max(1.2,pos(h1)-pos(h0))}%"></div>`;
  if (w1>0){ const a=pos(h0+w0), b=pos(h1+w1); s += `<div class="bar wait ${p.waitUnknown?'unknown':''}" style="left:${Math.max(a,pos(h1))}%;width:${Math.max(1.2,b-Math.max(a,pos(h1)))}%"></div>`; }
  return s + `</div>`;
}

/* ---------- routing ---------- */

async function route(){

    const id = h.slice(2);
    let g = findGuide(id);
    if (!g && caps.db){
      try { const snap = await caps.db.doc('guides/'+id).get(); if (snap.exists){ g = JSON.parse(snap.data().json); generated[id]=g; } } catch(e){}
    }
    if (g){ state.pendingHash=null; return renderGuide(g); }
    state.pendingHash = h;
    $('#app').innerHTML = `<p>Looking for this guide…</p><p class="muted">If it does not appear, it was generated in another session and has not been saved for you. <button class="back" onclick="goHome()">Go to all guides</button></p>`;

}

function openOrGenerate(q, id){

}

function shareLink(g){ return (location.href.split('#')[0]) + '#g-' + g.id; }
async function copyText(t, ok){
  try { await navigator.clipboard.writeText(t); toast(ok); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast(ok);}catch(_){ toast('Copy is blocked here. Use Download instead.'); } ta.remove(); }
}
async function downloadMd(g){
  const md = toMarkdown(g);
  if (caps.downloads){ try { await caps.downloads.save({ filename:`${g.id}-oauth-guide.md`, data: md }); return; } catch(e){ if (e && e.code==='declined') return; } }

  catch(e){ toast('Download is not available here. Use Copy as Markdown.'); }
}
function toMarkdown(g){
  const L=[]; const ev=i=>` _(${EV[i.ev]||'Unverified'}${i.src?.length?': '+i.src.map(id=>(g.sources||[]).find(s=>s.id===id)).filter(Boolean).map(s=>`[${shortTitle(s.title)}](${s.url})`).join(', '):''})_`;
  L.push(`# ${g.name}: OAuth app setup guide`, '', `${g.mode==='verified'?'Checked':'Generated (unverified)'} ${g.checked||''}. Start at ${g.startUrl||'the provider developer portal'}.`, '', `**${g.headline}**`, '', '## Paths');
  g.paths.forEach(p=>L.push(`- **${p.name}**: ${tierOf(p.tier)[0]}. ${fmtRange(p.hands[0],p.hands[1])} of work; wait ${p.wait&&p.wait[1]?fmtRange(p.wait[0],p.wait[1])+(p.waitUnknown?' (estimate)':''):'none'}. ${p.note||''}`));
  if (g.prereqs?.length){ L.push('','## Before you start'); g.prereqs.forEach(i=>L.push(`- ${i.t}${ev(i)}`)); }
  L.push('','## Steps'); (g.steps||[]).forEach((s,n)=>L.push(`${n+1}. **${s.t}** (${WHO[s.who]||s.who}). ${s.d}${ev(s)}`));
  if (g.snippet) L.push('', `${g.snippet.label}:`, '```'+(g.snippet.lang||''), g.snippet.code, '```');
  if (g.nuances?.length){ L.push('','## What can catch you out'); g.nuances.forEach(n=>L.push(`- **${n.t}.** ${n.d}${ev(n)}`)); }
  if (g.blockers?.length){ L.push('','## If you get stuck'); g.blockers.forEach(b=>L.push(`- **${b.if}:** ${b.then}`)); }
  L.push('','## Who does what','**An agent can:** '+(g.agent?.can||[]).join('; ')+'.','','**You need to:** '+(g.agent?.you||[]).join('; ')+'.');
  if (g.tested?.length){ L.push('','## What the agent tried'); g.tested.forEach(t=>L.push(`- ${t.what}. ${t.result}`)); }
  if (g.uncertain?.length){ L.push('','## Still uncertain'); g.uncertain.forEach(u=>L.push(`- ${u}`)); }
  if (g.review?.length){ L.push('','## Reviewer agent flagged'); g.review.forEach(u=>L.push(`- ${u}`)); }
  if (g.sources?.length){ L.push('','## Sources'); g.sources.forEach(s=>L.push(`- [${s.title}](${s.url})`)); }
  return L.join('\n');
}

/* ---------- live generation ---------- */
const STAGES = [
  ['identify','Identify the app','Confirm which product you mean and whether it uses OAuth.'],
  ['draft','Research the setup path','Work out paths, steps, requirements and waits.'],
  ['review','Skeptical review','A second agent looks for outdated or overconfident claims.'],
  ['save','Make it shareable','Save the guide so the link works for others.']
];
function renderGen(q){
  $('#app').innerHTML = `<button class="back" onclick="goHome()">All guides</button>
  <div class="gen"><h2>Writing a guide for ${esc(q)}</h2>
  <p class="muted" style="margin:6px 0 0">This usually takes one to two minutes.</p>
  <ul class="stages">${STAGES.map(([k,n,d])=>`<li id="st-${k}"><span class="dot"></span><div><div class="sn">${n}</div><div class="sd">${d}</div></div></li>`).join('')}</ul>
  <div id="genErr"></div>
  <div style="margin-top:14px"><button class="btn small ghost" id="stopGen">Stop</button></div></div>`;
}
function stage(k, status, note){
  const li = $('#st-'+k); if (!li) return;
  li.querySelector('.dot').className = 'dot ' + (status||'');
  if (note) li.querySelector('.sd').textContent = note;
}
function genError(msg){ state.busy=false; const e=$('#genErr'); if (e) e.innerHTML = `<p class="err">${esc(msg)}</p><button class="btn small" onclick="goHome()">Back to guides</button>`; }

const EXAMPLE = (() => { const g = JSON.parse(JSON.stringify(LIBRARY.find(x=>x.id==='github')||{})); delete g.tested; return g; })();
const SCHEMA_NOTE = `Return ONLY a JSON object with this shape (no prose, no code fences):
{"name":string,"domain":string,"category":string,"startUrl":string,
 "headline":string (2 sentences: what is easy, what is hard),
 "paths":[{"name":string,"tier":"self-serve"|"customer-approval"|"restricted"|"paid"|"review-required"|"gated"|"no-oauth","hands":[minMinutes,maxMinutes],"wait":[minMinutes,maxMinutes],"waitUnknown":boolean,"note":string}],
 "prereqs":[{"t":string,"ev":"model","src":[]}],
 "steps":[{"t":string,"d":string,"who":"you"|"agent"|"both","ev":"model","src":[]}],
 "nuances":[{"t":string,"d":string,"impact":"high"|"medium"|"low","ev":"model","src":[]}],
 "blockers":[{"if":string,"then":string}],
 "agent":{"can":[string],"you":[string]},
 "uncertain":[string],
 "sources":[{"id":string,"title":string,"url":string,"kind":"suggested"}]}`;

async function generate(q, key){
  if (state.busy) return;
  if (SERVER_API) return generateViaServer(q, key);
  if (!caps.sample){ toast('Live generation needs Claude. Open this page in Claude, or run the server from the repo.'); return; }
  state.busy = true; renderGen(q);
  const ctl = new AbortController(); $('#stopGen').onclick = () => { ctl.abort(); };
  const today = new Date().toISOString().slice(0,10);
  try {
    // 1. Identify
    stage('identify','run');
    const id = await caps.sample.json(
`A developer building an AI agent typed "${q}" because their users need to connect this app. Identify the product.
Return ONLY JSON: {"recognized":boolean,"name":string,"domain":string,"category":string,"oauth":"yes"|"no"|"unclear","developerPortal":string,"confidence":"high"|"medium"|"low","why":string (one sentence)}.
If you do not know this product, set recognized false and do not guess details.`, { modelTier:'quick', signal:ctl.signal });
    if (!id || id.recognized === false){
      stage('identify','fail', `Couldn't confidently identify "${q}". ${id&&id.why?id.why:''}`);
      return genError('Try the product\u2019s website address instead, for example example.com.');
    }
    stage('identify','done', `${id.name} (${id.domain}). OAuth: ${id.oauth}. Confidence: ${id.confidence}. ${id.why||''}`);

    // 2. Draft
    stage('draft','run','Drafting paths, steps and requirements…');
    let chars = 0;
    const draft = await caps.sample.json(
`You write OAuth app setup guides for developers building AI agents whose end users connect third-party apps (via an integration platform such as Composio, which supplies the redirect URL).
Write the guide for: ${id.name} (${id.domain}). Developer portal hint: ${id.developerPortal||'unknown'}. OAuth support: ${id.oauth}.

Rules:
- The developer needs to know: how hard it is, hands-on time vs approval wait, requirements and nuances that block approval, what an agent can do vs what they must do themselves.
- Split into "paths" when difficulty depends on what access is needed (e.g. basic scopes vs scopes that trigger review, internal vs public distribution, marketplace listing). Order paths from easiest to hardest. Times are in minutes.
- You cannot browse. Mark every claim "ev":"model". Do not invent precise figures (prices, review days) unless you are confident; if unsure, give a wide range, set waitUnknown true, and add the doubt to "uncertain".
- Mention policy or pricing changes you know of and the date you believe they took effect, and flag in "uncertain" that they may have changed since.
- If the product does not offer OAuth for third parties, use one path with tier "no-oauth" and explain the alternative (API keys, partner program).
- "sources" are official pages where the developer should verify (developer portal, OAuth docs, app review policy). Only include URLs you are confident exist; prefer root documentation URLs.
- Plain language, short sentences, 4-7 steps, 3-5 nuances.

Here is an example of a finished guide for a different app, for format and tone only (its evidence labels came from real sources; yours must all be "model"):
${JSON.stringify(EXAMPLE)}

${SCHEMA_NOTE}`, { modelTier:'default', signal:ctl.signal, onText:({text}) => { chars = text.length; stage('draft','run',`Drafting… ${chars.toLocaleString()} characters written`); } });
    validateGuide(draft);
    stage('draft','done', `${draft.paths.length} path${draft.paths.length>1?'s':''}, ${draft.steps.length} steps, ${draft.nuances?.length||0} things to watch.`);

    // 3. Review
    stage('review','run');
    let review = [];
    try {
      const r = await caps.sample.json(
`You are a skeptical reviewer of a developer guide about setting up an OAuth app for ${id.name}. Today is ${today}. The guide was written without browsing.
Find claims that are likely outdated, overconfident, or wrong (pricing, review timelines, scope tiers, deprecated products, renamed consoles). Do not rewrite the guide.
Return ONLY JSON: {"flags":[string]} with at most 5 short, specific flags, each saying what to verify and why. Return {"flags":[]} if nothing stands out.

Guide:
${JSON.stringify({headline:draft.headline,paths:draft.paths,steps:draft.steps,nuances:draft.nuances})}`, { modelTier:'quick', signal:ctl.signal });
      review = Array.isArray(r?.flags) ? r.flags.slice(0,5).map(String) : [];
      stage('review','done', review.length ? `${review.length} claim${review.length>1?'s':''} flagged for checking.` : 'Nothing flagged.');
    } catch(e){ if (e && e.code==='cancelled') throw e; stage('review','fail','Review step failed; the guide is shown without it.'); }

    // 4. Assemble + save
    const g = {
      id: key, mode:'generated', checked: today, ...draft,
      name: draft.name || id.name, domain: draft.domain || id.domain,
      review, tested: [{ what:'Live research in this view', result:'The agent could not open provider pages here, so nothing was tested. Run the repository server for web research and page probes.', date: today }],
    };
    g.sources = (g.sources||[]).map((s,i)=>({ id: s.id||('s'+i), title: s.title||s.url, url: s.url, kind:'suggested' })).filter(s=>/^https?:\/\//.test(s.url||''));
    generated[key] = g;
    stage('save','run');
    if (caps.db){
      try { await caps.db.doc('guides/'+key).set({ json: JSON.stringify(g), name: g.name, createdAt: Date.now() }); stage('save','done','Saved. The link works for anyone who can open this page.'); }
      catch(e){ stage('save','fail','Could not save for others (you may have view-only access). The link works in this session; use Download .md to share.'); }
    } else stage('save','fail','Saving is not available in this view. Use Download .md to share.');
    state.busy = false;
    setTimeout(()=>{ location.hash = 'g-' + key; if ((location.hash||'')==='#g-'+key) renderGuide(g); }, 700);
  } catch(e){
    const code = e && e.code;
    const msg = code==='cancelled' ? 'Stopped.' : code==='not_granted' ? 'Generation needs your permission to use Claude. Reload and allow it to try again.'
      : code==='rate_limited' ? 'Too many requests right now. Wait a minute and try again.' : code==='invalid_json' ? 'The agent returned a guide in the wrong format. Try again.'
      : (e && e.message) ? e.message : 'Something went wrong while writing the guide.';
    STAGES.forEach(([k])=>{ const d=$('#st-'+k+' .dot'); if (d && d.classList.contains('run')) stage(k,'fail'); });
    genError(msg);
  }
}
function validateGuide(d){
  if (!d || typeof d!=='object') throw { message:'The agent returned an empty guide. Try again.' };
  if (!Array.isArray(d.paths) || !d.paths.length) throw { message:'The guide had no setup paths. Try again.' };
  d.paths = d.paths.map(p=>({ ...p, hands: arr2(p.hands,[15,60]), wait: arr2(p.wait,[0,0]) }));
  d.steps = Array.isArray(d.steps)? d.steps : [];
  ['prereqs','steps','nuances'].forEach(k => (d[k]||[]).forEach(i => { i.ev = 'model'; i.src = []; }));
  d.headline = d.headline || '';
}
function arr2(a, def){ if (!Array.isArray(a)||a.length<2) return def; const x=Math.max(0,+a[0]||0), y=Math.max(x,+a[1]||0); return [x,y]; }

async function generateViaServer(q, key){
  state.busy = true; renderGen(q);
  const ctl = new AbortController(); $('#stopGen').onclick = () => ctl.abort();
  try {
    const res = await fetch(SERVER_API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ query:q, id:key }), signal: ctl.signal });
    if (!res.ok || !res.body) throw { message: `Server error ${res.status}` };
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf='';
    for(;;){
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      let i; while ((i = buf.indexOf('\n\n')) >= 0){
        const chunk = buf.slice(0,i); buf = buf.slice(i+2);
        const line = chunk.split('\n').find(l=>l.startsWith('data: ')); if (!line) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type==='stage') stage(ev.stage, ev.status, ev.note);
        if (ev.type==='error') throw { message: ev.message };
        if (ev.type==='guide'){ generated[ev.guide.id]=ev.guide; state.busy=false; location.hash='g-'+ev.guide.id; }
      }
    }
  } catch(e){ genError(e && e.name==='AbortError' ? 'Stopped.' : (e.message||'Server request failed.')); }
}

route();
</script>
</body>
